# ════════════════════════════════════════════════════════════════════
# PosBank · configuración de Supabase CLI
# Doc: https://supabase.com/docs/guides/local-development/cli/config
# El "project_id" es solo un identificador local del proyecto en la CLI.
# El proyecto remoto se enlaza con `supabase link --project-ref <ref>`.
# ════════════════════════════════════════════════════════════════════
project_id = "posbank"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Debe coincidir con la versión de Postgres del proyecto remoto (Supabase = 15).
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# URL del frontend (Bubble/App). Ajusta en producción.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
# MVP: sin doble opt-in por correo (el backend confirma al crear el usuario).
double_confirm_changes = false
enable_confirmations = false

[analytics]
enabled = false
